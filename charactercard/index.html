<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Card</title>
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="index.css">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Snortleblat - Character Card">
    <meta property="og:description" content="Welcome to the Swamp Beast Diplomat's swamp!">
    <meta property="og:url" content="https://haileymariesalmon.github.io/wdd131/charactercard/">
    <meta property="og:image" content="https://haileymariesalmon.github.io/wdd131/charactercard/images/social-preview.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Snortleblat - Character Card">
    <meta name="twitter:description" content="Welcome to the Swamp Beast Diplomat's swamp!">
    <meta name="twitter:image" content="https://haileymariesalmon.github.io/wdd131/charactercard/images/social-preview.png">
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="snortleblat.webp">
</head>
<body>
    <main class="card">
        <img id="image" class="image">
        <h1 id="name" class="name"></h1>
        <div class="stats">
            <p>Class: <span id="class"></span></p>
            <p>Level: <span id="level"></span></p>
            <p>Health: <span id="health"></span></p>
        </div>
        <div class="buttons">
            <button id="attack">Attacked</button>
            <button id="levelUp">Level Up</button>
        </div>
    </main>
</body>
</html>
